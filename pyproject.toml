[project]
name = "downloaderx"
version = "0.1.9"
description = "Multi-threaded, resumable file downloader for Python"
authors = [
    {name = "Tao Zeyu", email = "i@taozeyu.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["download", "downloader", "multi-threaded", "resume", "parallel", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests (>=2.32.4,<3.0.0)"
]

[project.urls]
Homepage = "https://github.com/Moskize91/downloaderx"
Repository = "https://github.com/Moskize91/downloaderx"
Issues = "https://github.com/Moskize91/downloaderx/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
flask = "^3.1.1"
parameterized = "^0.9.0"
pylint = "^3.3.7"
ruff = "^0.9.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

